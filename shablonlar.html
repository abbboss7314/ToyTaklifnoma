<style>
  :root{
    --bg:#0d1016;
    --bg2:#141922;
    --card:#171d27;
    --line:#28303d;
    --line2:#3a4453;
    --txt:#ece7dc;
    --txt2:#8f8a7e;
    --txt3:#635f57;
    --gold:#d4a856;
    --gold-l:#f0d79a;
    --gold-d:#96712c;
    --serif:'Cormorant Garamond',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--txt);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}
  a{color:inherit;text-decoration:none}

  /* ══════ HEADER ══════ */

    backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .hd{display:flex;align-items:center;justify-content:space-between;height:66px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand svg{width:30px;height:30px;flex:0 0 auto}
  .brand b{font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:.06em;line-height:1}
  .brand i{display:block;font-style:normal;font-size:7.5px;letter-spacing:.34em;
    text-transform:uppercase;color:var(--gold);margin-top:3px}
  .lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:30px;padding:3px}
  .lang button{background:none;border:none;cursor:pointer;color:var(--txt3);
    font-size:10px;letter-spacing:.12em;font-weight:500;padding:6px 11px;border-radius:24px;
    font-family:inherit;transition:.25s}
  .lang button.on{background:var(--gold);color:#12151c}

  /* ══════ HERO ══════ */
  .hero{position:relative;padding:86px 0 66px;text-align:center;overflow:hidden}
  .hero::before{content:"";position:absolute;top:-42%;left:50%;transform:translateX(-50%);
    width:1000px;height:760px;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,rgba(212,168,86,.13),transparent 62%)}
  .hero .in{position:relative;z-index:2}
  .eyebrow{font-size:9px;letter-spacing:.46em;text-transform:uppercase;color:var(--gold)}
  h1{font-family:var(--serif);font-weight:300;font-size:clamp(40px,7.6vw,76px);
    line-height:1.06;margin-top:20px;letter-spacing:-.012em}
  h1 em{font-style:italic;color:var(--gold-l);display:block}
  .sub{font-size:14.5px;line-height:1.9;color:var(--txt2);max-width:46ch;margin:24px auto 0;font-weight:300}
  .hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:34px}
  .btn{display:inline-flex;align-items:center;gap:9px;padding:15px 30px;border-radius:44px;
    font-size:10px;letter-spacing:.26em;text-transform:uppercase;font-weight:600;
    border:1px solid var(--gold);color:var(--gold-l);transition:.25s;cursor:pointer;font-family:inherit;
    background:none}
  .btn:hover{background:var(--gold);color:#12151c}
  .btn.solid{background:linear-gradient(180deg,#e0b866,#b98f3c);color:#12151c;border-color:transparent}
  .btn.solid:hover{filter:brightness(1.08)}
  .btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}

  .rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:52px 0 0}
  .rule span{height:1px;width:64px;background:var(--line2)}
  .rule svg{width:16px;height:16px}

  /* ══════ FILTR ══════ */
  .filters{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:30px}
  .chip{border:1px solid var(--line);background:none;color:var(--txt2);cursor:pointer;
    padding:10px 19px;border-radius:30px;font-size:11px;letter-spacing:.1em;font-family:inherit;
    transition:.25s}
  .chip:hover{border-color:var(--line2);color:var(--txt)}
  .chip.on{background:var(--txt);color:#12151c;border-color:var(--txt)}

  /* ══════ GRID ══════ */
  .sec-h{text-align:center;padding-top:74px}
  .sec-h .k{font-size:9px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
  .sec-h h2{font-family:var(--serif);font-weight:300;font-size:clamp(30px,5.4vw,46px);
    margin-top:14px;line-height:1.15}
  .sec-h p{font-size:13.5px;line-height:1.85;color:var(--txt2);max-width:44ch;margin:16px auto 0;font-weight:300}

  .grid{display:grid;gap:20px;margin-top:38px;
    grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    cursor:pointer;transition:border-color .3s,transform .3s,box-shadow .3s;position:relative}
  .card:hover{border-color:var(--gold-d);transform:translateY(-4px);
    box-shadow:0 22px 44px -26px rgba(0,0,0,.9)}
  .shot{position:relative;height:352px;overflow:hidden;background:#0a0d12}
  .shot iframe{position:absolute;top:0;left:50%;width:420px;height:880px;border:0;
    transform:translateX(-50%) scale(.615);transform-origin:top center;pointer-events:none}
  .shot::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 58%,rgba(13,16,22,.92) 100%)}
  .eye{position:absolute;right:12px;top:12px;z-index:3;width:34px;height:34px;border-radius:50%;
    background:rgba(13,16,22,.72);border:1px solid var(--line2);display:grid;place-items:center;
    opacity:0;transition:.3s}
  .card:hover .eye{opacity:1}
  .eye svg{width:15px;height:15px;stroke:var(--gold-l);fill:none;stroke-width:1.6}
  .meta{padding:18px 18px 20px;position:relative;z-index:2}
  .meta h3{font-family:var(--serif);font-size:24px;font-weight:400;line-height:1.2}
  .meta p{font-size:12.5px;line-height:1.7;color:var(--txt2);margin-top:8px;font-weight:300}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .tag{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);
    border:1px solid var(--line);border-radius:20px;padding:5px 11px}

  /* ══════ QADAMLAR ══════ */
  .steps{display:grid;gap:18px;margin-top:40px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .step{border:1px solid var(--line);border-radius:16px;padding:30px 24px;background:var(--bg2);
    text-align:center}
  .step .n{font-family:var(--serif);font-size:38px;color:var(--gold-d);line-height:1}
  .step h4{font-family:var(--serif);font-size:21px;font-weight:400;margin-top:14px}
  .step p{font-size:12.5px;line-height:1.85;color:var(--txt2);margin-top:10px;font-weight:300}

  /* ══════ NEGA BIZ ══════ */
  .why{display:grid;gap:16px;margin-top:38px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .w{display:flex;gap:14px;align-items:flex-start;padding:22px 20px;border:1px solid var(--line);
    border-radius:14px}
  .w svg{width:20px;height:20px;flex:0 0 auto;stroke:var(--gold);fill:none;stroke-width:1.5;margin-top:2px}
  .w b{display:block;font-size:13.5px;font-weight:500}
  .w span{display:block;font-size:12px;line-height:1.75;color:var(--txt2);margin-top:6px;font-weight:300}

  /* ══════ CTA ══════ */
  .cta{margin:84px 0 0;border:1px solid var(--line);border-radius:22px;padding:62px 26px;
    text-align:center;background:radial-gradient(120% 130% at 50% 0%,rgba(212,168,86,.12),transparent 62%),var(--bg2)}
  .cta h2{font-family:var(--serif);font-weight:300;font-size:clamp(28px,5vw,42px);line-height:1.2}
  .cta p{font-size:13.5px;line-height:1.85;color:var(--txt2);max-width:40ch;margin:16px auto 26px;font-weight:300}

  footer{margin-top:70px;border-top:1px solid var(--line);padding:34px 0 44px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
    font-size:11.5px;color:var(--txt3)}

  /* ══════ MODAL ══════ */
  .modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
    background:rgba(6,8,12,.9);backdrop-filter:blur(8px);padding:22px}
  .modal.open{display:flex}
  .modal .btn{padding:13px 24px;font-size:9.5px;letter-spacing:.2em}
  .mbox{width:100%;max-width:410px;display:flex;flex-direction:column;align-items:center;
    gap:14px;max-height:100%}
  /* ramka balandligi ekranga moslashadi — tugmalar doim ko'rinadi */
  .phone{--ph:min(calc(100dvh - 196px), 72vh, calc(84vw * 19 / 9));
    position:relative;height:var(--ph);width:calc(var(--ph) * 9 / 19);
    border-radius:34px;border:1px solid var(--line2);background:#000;overflow:hidden;
    flex:0 0 auto;box-shadow:0 40px 80px -40px rgba(0,0,0,1)}
  .phone iframe{width:100%;height:100%;border:0;display:block}
  .phone::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:78px;height:4px;border-radius:6px;background:#20252e;z-index:3}
  .mrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding-bottom:4px}
  .mtitle{font-family:var(--serif);font-size:22px;text-align:center;line-height:1}
  .mclose{position:fixed;top:18px;right:18px;width:40px;height:40px;border-radius:50%;
    border:1px solid var(--line2);background:rgba(20,25,34,.9);color:var(--txt);cursor:pointer;
    font-size:18px;line-height:1;display:grid;place-items:center;z-index:210}

  @media(max-width:640px){
    .hero{padding:60px 0 46px}
    .shot{height:320px}
    .cta{padding:48px 20px}
  }
</style>
</head>

let lang='uz', cat='all';

/* ═══════ chizish ═══════ */
const EYE='<svg viewBox="0 0 24 24"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICONS=[
 '<svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>',
 '<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M11 18h2"/></svg>',
 '<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 1118 0z"/><circle cx="12" cy="10" r="3"/></svg>',
 '<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>'];

function render(){
  const t=L[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(n=>{const v=t[n.dataset.t]; if(v) n.textContent=v;});
  igTop.href=IG_DM; igBottom.href=IG_DM; morder.href=IG_DM;
  document.getElementById("igProfile").href=IG_PRO;

  // filtrlar
  const cats=['all','milliy','klassik','minimal','zamonaviy','foto'];
  filters.innerHTML=cats.map(c=>
    `<button class="chip${c===cat?' on':''}" data-c="${c}">${t.cats[c]}</button>`).join('');

  // kartochkalar
  const list=T.filter(x=>cat==='all'||x.c.includes(cat));
  grid.innerHTML=list.map(x=>`
    <article class="card" data-f="${x.f}" data-n="${x.nm[lang]}">
      <div class="shot"><iframe data-src="${x.f}.html" title="${x.nm[lang]}"></iframe>
        <span class="eye">${EYE}</span></div>
      <div class="meta">
        <h3>${x.nm[lang]}</h3>
        <p>${t.desc[x.f]}</p>
        <div class="tags">${x.c.map(c=>`<span class="tag">${t.cats[c]}</span>`).join('')}</div>
      </div>
    </article>`).join('');
  lazyFrames(); requestAnimationFrame(fitFrames);

  steps.innerHTML=t.steps.map((s,i)=>
    `<div class="step"><div class="n">0${i+1}</div><h4>${s[0]}</h4><p>${s[1]}</p></div>`).join('');
  why.innerHTML=t.why.map((w,i)=>
    `<div class="w">${ICONS[i]}<div><b>${w[0]}</b><span>${w[1]}</span></div></div>`).join('');
}

/* oldindan ko'rinishni kartochka kengligiga moslash */
function fitFrames(){
  document.querySelectorAll('.shot').forEach(sh=>{
    const f=sh.querySelector('iframe'); if(!f)return;
    const k=sh.clientWidth/420;
    f.style.transform=`translateX(-50%) scale(${k.toFixed(4)})`;
  });
}
window.addEventListener('resize',fitFrames);

/* iframe'larni faqat ko'ringanda yuklash */
function lazyFrames(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){const f=e.target; if(!f.src&&f.dataset.src){f.src=f.dataset.src;} io.unobserve(f);}
  }),{rootMargin:'400px'});
  document.querySelectorAll('.shot iframe').forEach(f=>io.observe(f));
}

/* hodisalar */
document.querySelector('.lang').addEventListener('click',e=>{
  const b=e.target.closest('button[data-l]'); if(!b)return;
  lang=b.dataset.l;
  document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b)return; cat=b.dataset.c; render();
});
document.getElementById('grid').addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(!c)return;
  mframe.src=c.dataset.f+'.html';
  mopen.href=c.dataset.f+'.html';
  mtitle.textContent=c.dataset.n;
  modal.classList.add('open'); document.body.style.overflow='hidden';
});
function closeModal(){modal.classList.remove('open');mframe.src='';document.body.style.overflow='';}
mclose.onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

render();
</script>
